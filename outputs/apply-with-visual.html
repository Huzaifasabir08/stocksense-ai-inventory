<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apply · Nowshera Digital</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#f7f8fc] text-[#182033]"><main class="mx-auto max-w-2xl px-5 py-10"><img src="hiring-team.png" alt="Hiring team collaborating" class="h-56 w-full rounded-2xl object-cover shadow-lg"><div class="mt-8"><p class="font-semibold text-[#5b42d4]">Nowshera Digital · Open applications</p><h1 class="mt-2 text-4xl font-extrabold tracking-tight">Apply for a role you’ll love.</h1><p class="mt-3 text-slate-500">Everyone is welcome to apply. Upload your PDF CV and the hiring team will be in touch.</p></div><form onsubmit="event.preventDefault();document.querySelector('#done').classList.remove('hidden');this.reset()" class="mt-8 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm"><label class="block text-sm font-bold">Full name<input required class="mt-2 h-11 w-full rounded-xl border border-slate-200 px-3"></label><label class="mt-4 block text-sm font-bold">Email<input required type="email" class="mt-2 h-11 w-full rounded-xl border border-slate-200 px-3"></label><label class="mt-4 block text-sm font-bold">CV (PDF, max 2 MB)<input required type="file" accept="application/pdf" class="mt-2 block w-full rounded-xl border border-slate-200 p-3 text-sm"></label><label class="mt-4 flex gap-2 text-xs leading-5 text-slate-500"><input required type="checkbox"> I understand an AI tool summarises my CV, while people make every decision.</label><button class="mt-6 w-full rounded-xl bg-[#5b42d4] py-3 font-bold text-white">Submit application</button><div id="done" class="mt-4 hidden rounded-xl bg-emerald-50 p-4 text-sm font-semibold text-emerald-800">Application received.</div></form></main></body></html>
