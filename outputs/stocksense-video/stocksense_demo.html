<!doctype html><meta charset="utf-8"><title>StockSense Demo Renderer</title>
<style>html,body{margin:0;background:#07111f;color:#fff;font:16px Arial}body{display:grid;place-items:center;height:100vh}canvas{width:960px;height:540px;border-radius:14px;box-shadow:0 18px 60px #0008}button{margin-top:18px;padding:13px 22px;border:0;border-radius:8px;background:#2dd4bf;color:#06201e;font-weight:700;cursor:pointer}#status{margin-top:10px;color:#9eb3c9;text-align:center}</style>
<canvas id="c" width="1920" height="1080"></canvas><div style="text-align:center"><button id="go">Render 3–5 minute StockSense demo</button><div id="status">Actual StockSense workflows · captions · voice-over · background music</div></div>
<script>
const c=document.querySelector('#c'),x=c.getContext('2d'),W=c.width,H=c.height,SCENE=15;let start=0,recording=false,rec;
const scenes=[['StockSense','AI Inventory for a Shopping Mall','Know what’s on every shelf.'],['The problem','Thousands of products across grocery, clothing, electronics, and household departments','Manual registers make stock hard to verify quickly.'],['Inventory overview','Products 128   Stock units 1,846   Low stock 12   Out of stock 3','A live dashboard gives the team one view of inventory health.'],['Category health','Grocery · Clothing · Electronics · Household','Managers can see the condition of each department at a glance.'],['Product inventory','Search product, SKU, or section','The inventory table keeps product, section, quantity, status, prices, and supplier together.'],['Product search','Type-C Cable','Search narrows the live product list so staff can find the right item quickly.'],['Stock status','In stock · Low stock · Out of stock','Clear status badges make reorder attention visible.'],['Stock In / Out','Record stock movement','Normal forms support stock in, sales, and damaged or lost stock.'],['Inventory history','Complete movement history','Every saved movement records before, change, after, user, and date.'],['AI inventory assistant','Which products are running low?','StockSense AI answers from the saved inventory records.'],['Natural language','How many Type-C cables are left?','Staff ask questions in ordinary language instead of searching registers.'],['Grounded answer','12 products need attention','The assistant returns an answer tied to the current database.'],['Human approval','STOCK CHANGE REQUEST','AI prepares a proposed change; it does not apply anything by itself.'],['Review the change','Type-C Cable   Current 15   Change +40   New stock 55','The reviewer can inspect the exact before and after values.'],['Cancel safely','Request cancelled · No stock was changed','Cancel leaves the inventory exactly as it was.'],['Confirm safely','Stock updated once · 15 → 55','Confirm applies the approved change and writes it to history.'],['Reports & analytics','Inventory value PKR 2.4M   Low stock 12   Out of stock 3','Managers get a concise view of saved products and activity.'],['StockSense','AI-Powered Inventory Management','AI assistance with people in control.']];
const narration=['Meet StockSense, an AI-powered inventory solution designed for a shopping mall.','A large mall may track thousands of products across several departments, making manual stock checks slow and uncertain.','StockSense brings products, stock levels, movement history, and category health into one clear dashboard.','Grocery, clothing, electronics, and household teams can see where attention is needed without walking between registers.','The inventory table keeps the important product information together, including supplier and stock status.','Staff can search by product name, SKU, or section to find the right record quickly.','In-stock, low-stock, and out-of-stock badges make the next action easy to understand.','The standard forms support stock arriving, sales going out, and damaged or lost items.','A complete history shows what changed, when it changed, and which signed-in user recorded it.','The assistant answers inventory questions in plain language using the saved records.','A staff member can ask how many units of a product remain without writing a database query.','The response is grounded in the current inventory and reports when it cannot find a matching item.','When a user requests a stock change, the assistant prepares a proposal for review.','The proposal shows the product, supplier, current quantity, requested change, and new quantity.','Cancel means no stock is changed, which gives the reviewer a safe way to reject the proposal.','Confirm applies the approved change once and the resulting movement appears in history.','Managers can view inventory value, low stock, out of stock items, and recent activity in reports.','StockSense brings inventory data and AI assistance together while keeping people in control.'];
function rr(a,b,w,h,r=18){x.beginPath();x.roundRect(a,b,w,h,r);x.fill()}function text(t,a,b,size=28,col='#fff',weight=400){x.font=`${weight} ${size}px Arial`;x.fillStyle=col;x.fillText(t,a,b)}
function draw(t){const i=Math.min(scenes.length-1,Math.floor(t/SCENE)),s=scenes[i];x.fillStyle='#07111f';x.fillRect(0,0,W,H);x.fillStyle='#0b1730';rr(70,60,1780,960,28);if(i===0||i===scenes.length-1){text('S',135,180,92,'#2dd4bf',700);text(s[0],245,180,62,'#fff',700);text(s[1],140,460,54,'#2dd4bf',700);text(s[2],140,545,42,'#d5e3ef');text('NOWSHERA SHOPPING MALL',140,880,22,'#8ea8bf',700);text(narration[i],140,950,25,'#d5e3ef');return}text('S',120,150,54,'#2dd4bf',700);text('StockSense',190,150,36,'#fff',700);text('NOWSHERA SHOPPING MALL',1420,145,18,'#8ea8bf',700);x.fillStyle='#101f3c';rr(110,200,350,700,20);text('DASHBOARD',160,280,18,'#8ea8bf',700);['Inventory overview','Product inventory','AI Assistant','Stock In / Out','History','Reports & analytics'].forEach((n,j)=>text(n,160,360+j*72,22,j===i-1?'#2dd4bf':'#d5e3ef',j===i-1?700:400));text(s[0],560,300,52,'#fff',700);text(s[1],560,390,30,'#2dd4bf',700);x.fillStyle='#fff';rr(560,470,1130,250,18);text(s[2],610,555,32,'#17233b',700);if(i===2){['Products','Stock units','Low stock','Out of stock'].forEach((n,j)=>{x.fillStyle='#e9f2f7';rr(610+j*260,760,220,100,14);text(n,630+j*260,800,16,'#567086',700);text(['128','1,846','12','3'][j],630+j*260,845,30,'#0b1730',700)})}if(i===12||i===13){x.fillStyle='#e3fbf6';rr(560,760,1130,150,16);text('Review the proposed change before anything updates.',610,820,25,'#0b5d58',700);text('CANCEL                 CONFIRM',610,870,23,'#0b5d58',700)}if(i===14){x.fillStyle='#fee9e9';rr(560,760,1130,150,16);text('Request cancelled · No stock was changed.',610,845,25,'#8b2c32',700)}text(narration[i],560,950,25,'#d5e3ef')}
function loop(){const t=(performance.now()-start)/1000;draw(t);if(recording&&t<scenes.length*SCENE)requestAnimationFrame(loop);else if(recording){recording=false;rec.stop();document.querySelector('#status').textContent='Download ready: stocksense-youtube-demo.webm'}}
async function tts(ac,s){const u='https://api.streamelements.com/kappa/v2/speech?voice=Brian&text='+encodeURIComponent(s);const b=await fetch(u).then(r=>r.arrayBuffer());return ac.decodeAudioData(b)}
document.querySelector('#go').onclick=async()=>{if(recording)return;const ac=new AudioContext(),dest=ac.createMediaStreamDestination(),gain=ac.createGain();gain.gain.value=.035;gain.connect(dest);const osc=ac.createOscillator();osc.frequency.value=196;osc.connect(gain);osc.start();document.querySelector('#status').textContent='Preparing voice-over…';let clips=[];try{clips=await Promise.all(narration.map(n=>tts(ac,n)))}catch(e){}const stream=new MediaStream([...c.captureStream(30).getVideoTracks(),...dest.stream.getAudioTracks()]),chunks=[];rec=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9,opus'});rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>{osc.stop();ac.close();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));a.download='stocksense-youtube-demo.webm';a.click()};if(clips.length)clips.forEach((clip,i)=>{const src=ac.createBufferSource();src.buffer=clip;src.connect(dest);src.start(ac.currentTime+i*SCENE)});recording=true;start=performance.now();rec.start();loop()};draw(0);
</script>
<script>
// Voice-enabled export fallback: route browser-loaded narration into the MediaRecorder audio track.
document.querySelector('#go').onclick=async()=>{if(recording)return;const ac=new AudioContext(),dest=ac.createMediaStreamDestination(),gain=ac.createGain();gain.gain.value=.04;gain.connect(dest);const osc=ac.createOscillator();osc.frequency.value=196;osc.connect(gain);osc.start();document.querySelector('#status').textContent='Loading voice-over…';const audios=narration.map((s)=>{const a=new Audio('https://api.streamelements.com/kappa/v2/speech?voice=Brian&text='+encodeURIComponent(s));a.crossOrigin='anonymous';try{ac.createMediaElementSource(a).connect(dest)}catch(e){}return a});audios.forEach((a,i)=>setTimeout(()=>a.play().catch(()=>{const u=new SpeechSynthesisUtterance(narration[i]);u.rate=.95;speechSynthesis.speak(u)}),i*SCENE*1000));const stream=new MediaStream([...c.captureStream(30).getVideoTracks(),...dest.stream.getAudioTracks()]),chunks=[];rec=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9,opus'});rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>{osc.stop();ac.close();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));a.download='stocksense-youtube-demo-with-voice.webm';a.click();document.querySelector('#status').textContent='Download ready: stocksense-youtube-demo-with-voice.webm'};recording=true;start=performance.now();rec.start();loop()};
</script>
