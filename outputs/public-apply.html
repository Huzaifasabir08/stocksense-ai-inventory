<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apply to Nowshera Digital</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-50 text-slate-900"><main class="mx-auto max-w-2xl px-5 py-10"><div class="mb-8"><p class="font-semibold text-violet-700">Nowshera Digital · Open applications</p><h1 class="mt-2 text-4xl font-extrabold tracking-tight">Apply for Frontend Engineer</h1><p class="mt-3 text-slate-500">Everyone is welcome to apply. Complete the form and upload your CV as a PDF.</p></div><form onsubmit="event.preventDefault();document.querySelector('#done').classList.remove('hidden');this.reset()" class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm"><label class="block text-sm font-bold">Full name<input required class="mt-2 h-11 w-full rounded-xl border border-slate-200 px-3" placeholder="Your name"></label><label class="mt-4 block text-sm font-bold">Email address<input required type="email" class="mt-2 h-11 w-full rounded-xl border border-slate-200 px-3" placeholder="you@example.com"></label><label class="mt-4 block text-sm font-bold">Phone number<input required class="mt-2 h-11 w-full rounded-xl border border-slate-200 px-3" placeholder="+92"></label><label class="mt-4 block text-sm font-bold">CV (PDF, maximum 2 MB)<input required type="file" accept="application/pdf" class="mt-2 block w-full rounded-xl border border-slate-200 p-3 text-sm"></label><label class="mt-4 flex gap-2 text-xs leading-5 text-slate-500"><input required type="checkbox" class="mt-1"> I understand an AI tool summarises my CV for the recruiter, while people make every hiring decision.</label><button class="mt-6 w-full rounded-xl bg-violet-700 py-3 font-bold text-white">Submit application</button><div id="done" class="mt-4 hidden rounded-xl bg-emerald-50 p-4 text-sm font-semibold text-emerald-800">Application received. A confirmation email will be sent.</div></form></main></body></html>
