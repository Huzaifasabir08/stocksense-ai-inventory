<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Recruitment / Applicant Tracking System · Huzaifa Sabir</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;background:#f7f8fc;color:#182033}.card{border:1px solid #e6e9f0;background:#fff;border-radius:18px;box-shadow:0 8px 30px rgba(33,24,74,.05)}.nav-active{background:#f0ecff;color:#5b42d4}.stage{min-height:320px}.modal{background:rgba(15,23,42,.36)}</style></head>
<body><div id="app"></div><script>
const applicants=[{id:1,name:'Ayesha Noor',role:'Senior Product Designer',stage:'Applied',initials:'AN',applied:'Today, 9:42 AM',summary:'Product designer with 6+ years building accessible SaaS workflows and design systems. Strong research-to-prototype practice.',skills:['Figma','Design systems','User research']},{id:2,name:'Hamza Khan',role:'Frontend Engineer',stage:'Shortlisted',initials:'HK',applied:'Yesterday',summary:'Frontend engineer focused on React and TypeScript. Has shipped component libraries and performance improvements for high-traffic products.',skills:['React','TypeScript','Next.js']},{id:3,name:'Sara Ali',role:'Support Specialist',stage:'Interview',initials:'SA',applied:'Sep 26',summary:'Customer support specialist experienced in technical troubleshooting, help-center content, and calm communication across channels.',skills:['Zendesk','Technical support','English'],interview:'Oct 02 · 11:00 AM'},{id:4,name:'Omar Farooq',role:'Backend Developer',stage:'Offer',initials:'OF',applied:'Sep 25',summary:'Backend developer with a strong Python and PostgreSQL background. Comfortable owning APIs, testing, and deployment workflows.',skills:['Python','PostgreSQL','REST APIs']},{id:5,name:'Mariam Shah',role:'Frontend Engineer',stage:'Applied',initials:'MS',applied:'Sep 24',summary:'Frontend developer with a sharp eye for detail and experience translating complex product requirements into clear interfaces.',skills:['React','CSS','Accessibility']}];
const stages=['Applied','Shortlisted','Interview','Offer','Hired'];let view='overview',selected=applicants[1],notice='';
function tone(s){return {'Applied':'bg-violet-50 text-violet-700','Shortlisted':'bg-amber-50 text-amber-700','Interview':'bg-sky-50 text-sky-700','Offer':'bg-emerald-50 text-emerald-700','Hired':'bg-teal-50 text-teal-700'}[s]||'bg-slate-100 text-slate-600'}
function shell(content){document.querySelector('#app').innerHTML=`<header class="sticky top-0 z-20 border-b border-slate-200/80 bg-white/90 backdrop-blur"><div class="mx-auto flex h-[72px] max-w-[1500px] items-center gap-8 px-5 lg:px-8"><button onclick="setView('overview')" class="flex items-center gap-3"><span class="grid size-10 place-items-center rounded-[13px] bg-[#5b42d4] text-xl text-white shadow-lg">✦</span><span class="text-lg font-extrabold tracking-tight">Nowshera Digital</span></button><nav class="hidden items-center gap-1 md:flex"><button onclick="setView('overview')" class="rounded-xl px-4 py-2 text-sm font-semibold ${view==='overview'?'nav-active':'text-slate-500'}">▦ Overview</button><button onclick="setView('pipeline')" class="rounded-xl px-4 py-2 text-sm font-semibold ${view==='pipeline'?'nav-active':'text-slate-500'}">▣ Pipeline</button><button onclick="setView('jobs')" class="rounded-xl px-4 py-2 text-sm font-semibold ${view==='jobs'?'nav-active':'text-slate-500'}">▤ Jobs</button><button onclick="setView('candidates')" class="rounded-xl px-4 py-2 text-sm font-semibold ${view==='candidates'?'nav-active':'text-slate-500'}">♙ Candidates</button></nav><div class="ml-auto flex items-center gap-3"><span class="text-slate-500">♧</span><div class="grid size-9 place-items-center rounded-full bg-[#f3c7b5] text-xs font-bold text-[#7b3f30]">SA</div><div class="hidden leading-tight lg:block"><p class="text-sm font-bold">Sana Ahmed</p><p class="text-xs text-slate-400">Hiring manager</p></div></div></div></header><div class="mx-auto max-w-[1500px] px-5 py-8 lg:px-8">${notice?`<div class="mb-5 rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm font-medium text-emerald-800">✓ ${notice}</div>`:''}${content}</div>`}
function setView(v){view=v;render()};function render(){if(view==='overview')return overview();if(view==='jobs')return jobs();return pipeline()}
function overview(){shell(`<div class="flex flex-col justify-between gap-5 sm:flex-row sm:items-end"><div><p class="text-sm font-semibold text-[#5b42d4]">Monday, September 28, 2026</p><h1 class="mt-2 text-3xl font-extrabold tracking-tight sm:text-4xl">Good morning, Sana ✦</h1><p class="mt-2 text-slate-500">Here’s what’s happening with your hiring today.</p></div><button onclick="setView('jobs')" class="rounded-xl bg-[#5b42d4] px-4 py-3 text-sm font-bold text-white shadow-lg">＋ Create a job</button></div><div class="mt-8 grid gap-4 sm:grid-cols-2 xl:grid-cols-4">${[['Open positions','3','Across 3 teams','▣','bg-violet-50 text-violet-700'],['Total applicants','38','+8 this week','♙','bg-sky-50 text-sky-700'],['Interviews this week','6','2 need scheduling','□','bg-orange-50 text-orange-700'],['Time to hire','12 days','2 days faster','◷','bg-emerald-50 text-emerald-700']].map(x=>`<div class="card p-5"><div class="flex items-start justify-between"><div><p class="text-sm font-medium text-slate-500">${x[0]}</p><p class="mt-3 text-3xl font-extrabold">${x[1]}</p><p class="mt-2 text-xs font-semibold text-emerald-600">${x[2]}</p></div><span class="grid size-10 place-items-center rounded-xl ${x[4]}">${x[3]}</span></div></div>`).join('')}</div><div class="mt-8 grid gap-6 xl:grid-cols-[1.4fr_1fr]"><section class="card p-5"><div class="flex items-center justify-between"><div><h2 class="text-lg font-bold">Hiring pipeline</h2><p class="mt-1 text-sm text-slate-500">All active applications across your open roles.</p></div><button onclick="setView('pipeline')" class="text-sm font-bold text-[#5b42d4]">View pipeline →</button></div><div class="mt-6 grid grid-cols-5 gap-2">${stages.map(s=>`<div><div class="flex items-end justify-between"><p class="text-xs font-semibold text-slate-500">${s}</p><p class="text-lg font-extrabold">${applicants.filter(a=>a.stage===s).length}</p></div><div class="mt-2 h-2 rounded-full bg-slate-100"><div class="h-full rounded-full bg-[#5b42d4]" style="width:${Math.max(12,applicants.filter(a=>a.stage===s).length*18)}%"></div></div></div>`).join('')}</div><div class="mt-8 divide-y divide-slate-100">${applicants.slice(0,4).map(a=>`<button onclick="selected=applicants.find(x=>x.id===${a.id});setView('pipeline')" class="flex w-full items-center gap-3 py-4 text-left hover:bg-slate-50"><span class="grid size-10 place-items-center rounded-full bg-[#eee9ff] text-sm font-bold text-[#5b42d4]">${a.initials}</span><span class="min-w-0 flex-1"><b class="block truncate text-sm">${a.name}</b><span class="text-xs text-slate-500">${a.role}</span></span><span class="rounded-full px-2.5 py-1 text-xs font-bold ${tone(a.stage)}">${a.stage}</span><span class="text-slate-300">›</span></button>`).join('')}</div></section><section class="rounded-2xl bg-[#21184a] p-6 text-white shadow-xl"><div class="text-sm font-bold text-violet-200">✦ AI recruiting assistant</div><h2 class="mt-5 text-2xl font-extrabold leading-tight">Spend less time reading CVs. More time meeting people.</h2><p class="mt-3 text-sm leading-6 text-violet-100">Every application gets a clear, structured summary so your team can review faster. AI assists; your people decide.</p><div class="mt-8 rounded-xl border border-white/10 bg-white/10 p-4"><p class="text-xs font-bold uppercase tracking-widest text-violet-200">Today’s insight</p><p class="mt-2 text-sm leading-6">3 new CV summaries are ready for review. No candidate data is scored or ranked.</p></div></section></div>`)}
function pipeline(){shell(`<div class="flex flex-col justify-between gap-5 sm:flex-row sm:items-end"><div><p class="text-sm font-semibold text-[#5b42d4]">Recruiter workspace</p><h1 class="mt-2 text-3xl font-extrabold tracking-tight">Application pipeline</h1><p class="mt-2 text-slate-500">Move candidates forward one step at a time. Every decision stays with your team.</p></div><button class="rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-bold">⚑ Filter</button></div><div class="mt-7 grid gap-5 xl:grid-cols-[minmax(0,1fr)_370px]"><section class="card overflow-hidden"><div class="border-b border-slate-100 p-4"><div class="relative"><input id="q" oninput="filterPipe()" placeholder="Search candidates or roles" class="h-10 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 text-sm outline-none"></div></div><div id="board" class="grid grid-cols-5 gap-3 overflow-x-auto p-4">${stages.map(s=>`<div class="stage min-w-[190px]"><div class="mb-3 flex items-center justify-between"><span class="text-xs font-bold uppercase tracking-wider text-slate-500">${s}</span><span class="grid size-5 place-items-center rounded-full bg-slate-100 text-[11px] font-bold">${applicants.filter(a=>a.stage===s).length}</span></div><div class="space-y-3">${applicants.filter(a=>a.stage===s).map(a=>`<button onclick="selected=applicants.find(x=>x.id===${a.id});render()" class="w-full rounded-xl border ${selected&&selected.id===a.id?'border-violet-400 ring-2 ring-violet-100':'border-slate-200'} p-4 text-left transition hover:shadow-md"><span class="grid size-9 place-items-center rounded-full bg-[#eee9ff] text-xs font-bold text-[#5b42d4]">${a.initials}</span><p class="mt-3 text-sm font-bold">${a.name}</p><p class="mt-1 text-xs text-slate-500">${a.role}</p><p class="mt-3 text-[11px] text-slate-400">Applied ${a.applied}</p></button>`).join('')}</div></div>`).join('')}</div></section>${panel()}</div>`)}
function panel(){let a=selected;if(!a)return '';let idx=stages.indexOf(a.stage),next=stages[Math.min(idx+1,stages.length-1)];return `<aside class="card p-5"><div class="flex items-center gap-3"><span class="grid size-12 place-items-center rounded-full bg-[#eee9ff] font-bold text-[#5b42d4]">${a.initials}</span><div><h2 class="font-bold">${a.name}</h2><p class="text-sm text-slate-500">${a.role}</p></div></div><div class="mt-5 rounded-xl border border-violet-100 bg-violet-50/70 p-4"><div class="text-xs font-bold text-[#5b42d4]">✦ AI SUMMARY · Human review</div><p class="mt-3 text-sm leading-6 text-slate-700">${a.summary}</p><div class="mt-3 flex flex-wrap gap-1.5">${a.skills.map(s=>`<span class="rounded-full bg-white px-2.5 py-1 text-[11px] font-semibold text-slate-600">${s}</span>`).join('')}</div></div><div class="mt-5 flex items-center justify-between text-sm"><span class="text-slate-500">Current stage</span><span class="rounded-full px-2.5 py-1 text-xs font-bold ${tone(a.stage)}">${a.stage}</span></div><button class="mt-5 w-full rounded-xl border border-slate-200 py-3 text-sm font-bold">▤ Open CV</button>${!['Hired','Rejected','Withdrawn'].includes(a.stage)?`<div class="mt-3 grid grid-cols-2 gap-2"><button onclick="move(${a.id},'${next}')" class="rounded-xl bg-[#5b42d4] py-3 text-xs font-bold text-white">Move to ${next}</button><button onclick="move(${a.id},'Rejected')" class="rounded-xl border border-rose-200 py-3 text-xs font-bold text-rose-700">Reject</button></div>`:''}<div class="mt-5 border-t border-slate-100 pt-4"><label class="text-xs font-bold text-slate-500">Private recruiter note</label><textarea placeholder="Add context for your hiring team…" class="mt-2 min-h-20 w-full resize-none rounded-xl border border-slate-200 p-3 text-sm"></textarea></div></aside>`}
function move(id,next){let a=applicants.find(x=>x.id===id);if(a){a.stage=next;notice=`Application moved to ${next}.`;render()}}
function filterPipe(){let q=document.querySelector('#q').value.toLowerCase();document.querySelectorAll('#board button').forEach(b=>b.style.display=b.innerText.toLowerCase().includes(q)?'':'none')}
function jobs(){shell(`<div class="flex flex-col justify-between gap-5 sm:flex-row sm:items-end"><div><p class="text-sm font-semibold text-[#5b42d4]">Admin workspace</p><h1 class="mt-2 text-3xl font-extrabold tracking-tight">Your open positions</h1><p class="mt-2 text-slate-500">Create roles, assign recruiters, and keep every deadline visible.</p></div><button onclick="document.querySelector('#jobmodal').classList.remove('hidden')" class="rounded-xl bg-[#5b42d4] px-4 py-3 text-sm font-bold text-white">＋ Create a job</button></div><div class="mt-8 grid gap-4 lg:grid-cols-3">${[['Frontend Engineer','Product & Engineering','Nowshera · Hybrid','18','2','Oct 18, 2026','#7c3aed'],['Product Designer','Design','Remote · Pakistan','12','1','Oct 12, 2026','#0f766e'],['Support Specialist','Customer Experience','Nowshera · On-site','8','2','Oct 24, 2026','#c2410c']].map(j=>`<article class="card p-5"><span class="grid size-11 place-items-center rounded-xl text-white" style="background:${j[6]}">▣</span><h2 class="mt-5 text-lg font-bold">${j[0]}</h2><p class="mt-1 text-sm text-slate-500">${j[1]}</p><p class="mt-4 text-sm text-slate-600">${j[2]}</p><div class="mt-5 flex justify-between border-t border-slate-100 pt-4 text-sm"><span><b>${j[3]}</b> applicants</span><span><b>${j[4]}</b> openings</span></div><div class="mt-3 text-xs font-semibold text-slate-500">◷ Apply by ${j[5]}</div><button class="mt-5 w-full rounded-xl border border-slate-200 py-3 text-sm font-bold">Manage position →</button></article>`).join('')}</div><div id="jobmodal" class="modal fixed inset-0 z-50 hidden place-items-center p-4"><div class="w-full max-w-lg rounded-2xl bg-white p-6 shadow-2xl"><div class="flex items-center justify-between"><div><h2 class="text-xl font-bold">Create a job</h2><p class="mt-1 text-sm text-slate-500">Keep it as a draft until details are ready.</p></div><button onclick="document.querySelector('#jobmodal').classList.add('hidden')">×</button></div><div class="mt-5 space-y-3"><input placeholder="Job title" class="h-11 w-full rounded-xl border border-slate-200 px-3 text-sm"><input placeholder="Department" class="h-11 w-full rounded-xl border border-slate-200 px-3 text-sm"><textarea placeholder="Description and requirements" class="min-h-28 w-full rounded-xl border border-slate-200 p-3 text-sm"></textarea></div><button onclick="document.querySelector('#jobmodal').classList.add('hidden');notice='Job saved as a draft.';render()" class="mt-5 w-full rounded-xl bg-[#5b42d4] py-3 text-sm font-bold text-white">Create job</button></div></div>`)}
render();
</script></body></html>
